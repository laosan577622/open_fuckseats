<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="不想排座位 FuckSeats">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", "Noto Sans SC", sans-serif; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12161e"/>
      <stop offset="1" stop-color="#0b1222"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="lift" x="-40%" y="-60%" width="180%" height="240%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="frame">
      <rect width="1280" height="400" rx="28"/>
    </clipPath>
    <g id="sa">
      <rect width="36" height="28" rx="7" fill="#0a59f7"/>
      <rect x="8" y="12" width="20" height="4" rx="2" fill="#ffffff" fill-opacity="0.9"/>
    </g>
    <g id="sb">
      <rect width="36" height="28" rx="7" fill="#0a59f7" fill-opacity="0.45"/>
      <rect x="8" y="12" width="20" height="4" rx="2" fill="#ffffff" fill-opacity="0.75"/>
    </g>
    <g id="se">
      <rect x="0.75" y="0.75" width="34.5" height="26.5" rx="6.25" fill="none" stroke="#5b8dff" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3 3"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <circle cx="1090" cy="40" r="210" fill="#0a59f7" opacity="0.28" filter="url(#glow)"/>
    <circle cx="140" cy="430" r="190" fill="#0a59f7" opacity="0.16" filter="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- 品牌 -->
  <g transform="translate(96 88)">
    <rect width="28" height="28" rx="8" fill="#0a59f7"/>
    <rect x="36" width="28" height="28" rx="8" fill="#0a59f7" fill-opacity="0.68"/>
    <rect y="36" width="28" height="28" rx="8" fill="#0a59f7" fill-opacity="0.68"/>
    <rect x="36" y="36" width="28" height="28" rx="8" fill="#0a59f7"/>
  </g>
  <text x="182" y="114" font-size="22" font-weight="700" fill="#5b8dff">FuckSeats</text>
  <text x="182" y="144" font-size="17" fill="#a1a1a6">智能排座 · 考场规划 · 多端同步</text>

  <text x="92" y="236" font-size="66" font-weight="700" letter-spacing="2" fill="#f5f5f7">不想排座位</text>
  <text x="96" y="282" font-size="25" fill="#a1a1a6">给班主任和教务人员的桌面排座工具</text>

  <g font-size="18" font-weight="600" text-anchor="middle" fill="#7aa5ff">
    <rect x="96" y="304" width="108" height="40" rx="20" fill="#0a59f7" fill-opacity="0.22"/>
    <text x="150" y="324" dominant-baseline="central">本地加密</text>
    <rect x="214" y="304" width="108" height="40" rx="20" fill="#0a59f7" fill-opacity="0.22"/>
    <text x="268" y="324" dominant-baseline="central">规则排座</text>
    <rect x="332" y="304" width="108" height="40" rx="20" fill="#0a59f7" fill-opacity="0.22"/>
    <text x="386" y="324" dominant-baseline="central">考场规划</text>
    <rect x="450" y="304" width="108" height="40" rx="20" fill="#0a59f7" fill-opacity="0.22"/>
    <text x="504" y="324" dominant-baseline="central">开放接入</text>
  </g>

  <!-- 座位表窗口 -->
  <rect x="700" y="62" width="484" height="276" rx="20" fill="#1a1f29" stroke="#2a3140" filter="url(#card)"/>
  <circle cx="724" cy="84" r="5.5" fill="#3a4150"/>
  <circle cx="742" cy="84" r="5.5" fill="#3a4150"/>
  <circle cx="760" cy="84" r="5.5" fill="#3a4150"/>
  <text x="782" y="84" font-size="15" font-weight="600" fill="#f5f5f7" dominant-baseline="central">高一（3）班</text>
  <text x="872" y="84" font-size="13" fill="#8b949e" dominant-baseline="central">42 人</text>
  <rect x="1080" y="70" width="88" height="28" rx="14" fill="#0a59f7"/>
  <text x="1124" y="84" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">自动排座</text>
  <line x1="700" y1="106.5" x2="1184" y2="106.5" stroke="#262c38"/>

  <rect x="882" y="120" width="120" height="22" rx="11" fill="#0a59f7" fill-opacity="0.24"/>
  <text x="942" y="131" font-size="12" font-weight="600" fill="#7aa5ff" text-anchor="middle" dominant-baseline="central">讲台</text>

  <use href="#sa" x="753" y="158"/>
  <use href="#sa" x="795" y="158"/>
  <use href="#sb" x="853" y="158"/>
  <use href="#sb" x="895" y="158"/>
  <use href="#sa" x="953" y="158"/>
  <use href="#sa" x="995" y="158"/>
  <use href="#sb" x="1053" y="158"/>
  <use href="#sb" x="1095" y="158"/>

  <use href="#sb" x="753" y="198"/>
  <use href="#sb" x="795" y="198"/>
  <rect x="853.75" y="198.75" width="34.5" height="26.5" rx="6.25" fill="#0a59f7" fill-opacity="0.1" stroke="#5b8dff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <use href="#sa" x="895" y="198"/>
  <use href="#sa" x="953" y="198"/>
  <use href="#sb" x="995" y="198"/>
  <use href="#sa" x="1053" y="198"/>
  <use href="#sa" x="1095" y="198"/>

  <use href="#sa" x="753" y="238"/>
  <use href="#sa" x="795" y="238"/>
  <use href="#sb" x="853" y="238"/>
  <use href="#sa" x="895" y="238"/>
  <use href="#sb" x="953" y="238"/>
  <use href="#se" x="995" y="238"/>
  <use href="#sb" x="1053" y="238"/>
  <use href="#sa" x="1095" y="238"/>

  <use href="#se" x="753" y="278"/>
  <use href="#sb" x="795" y="278"/>
  <use href="#sa" x="853" y="278"/>
  <use href="#sa" x="895" y="278"/>
  <use href="#sb" x="953" y="278"/>
  <use href="#sb" x="995" y="278"/>
  <use href="#sa" x="1053" y="278"/>
  <use href="#se" x="1095" y="278"/>

  <!-- 拖拽中的座位 -->
  <g transform="translate(995 226) rotate(-6 18 14)" filter="url(#lift)">
    <use href="#sa"/>
  </g>
  <path d="M1024 246 L1024 262 L1028.5 258 L1031.5 265 L1034 264 L1031 257 L1037 257 Z" fill="#ffffff" stroke="#0b0d12" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- 状态提示 -->
  <rect x="1036" y="318" width="168" height="44" rx="22" fill="#222835" stroke="#2f3746" filter="url(#card)"/>
  <circle cx="1060" cy="340" r="11" fill="#0a59f7"/>
  <path d="M1055 340.2 L1058.6 343.8 L1065 336.8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1080" y="340" font-size="14" font-weight="600" fill="#f5f5f7" dominant-baseline="central">约束已全部满足</text>
</svg>
