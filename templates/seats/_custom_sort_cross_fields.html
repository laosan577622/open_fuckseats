<label class="custom-sort-cross-option">
    <input type="checkbox" name="cross_classrooms" value="1" checked data-cross-classroom-toggle>
    <span>
        <strong>允许跨班级</strong>
        <small>按全组座位容量重新分配学生。</small>
    </span>
</label>
<label class="custom-sort-cross-mode" data-cross-classroom-mode>
    跨班级处理
    <select name="cross_classroom_mode">
        <option value="ignore_original">不考虑原班级</option>
        <option value="prefer_original">原班级优先</option>
        <option value="avoid_original">原班级尽力排除</option>
    </select>
</label>
