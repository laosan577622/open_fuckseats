<div id="future-mode-root" hidden data-inline-dock="1" data-chat-url="{% url 'wendao_chat' classroom.pk %}" data-chat-stream-url="{% url 'wendao_chat_stream' classroom.pk %}" data-classroom-id="{{ classroom.pk }}" data-classroom-name="{{ classroom.name }}" data-csrf="{{ csrf_token }}"></div>
<section id="wd-composer-panel" class="wd-panel wd-spectrum wd-composer-panel" hidden role="region" aria-label="闻道智能快捷提问">
    <span class="wd-morph-label" aria-hidden="true">闻道智能</span>
    <div class="wd-panel-content"><form id="future-chat-form" class="wd-quick-form" aria-label="闻道智能快捷提问">
        <input id="userInput" type="text" placeholder="向闻道智能提问" aria-label="向闻道智能提问" autocomplete="off" maxlength="16000">
        <button type="button" id="wd-model-trigger" class="wd-quick-gear" aria-label="选择模型" aria-expanded="false" aria-controls="wd-model-panel"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M10.4 2.8h3.2l.6 2.1c.5.2 1 .5 1.5.9l2.1-.6 1.6 2.8-1.5 1.6a7.5 7.5 0 0 1 0 1.8l1.5 1.6-1.6 2.8-2.1-.6c-.5.4-1 .7-1.5.9l-.6 2.1h-3.2l-.6-2.1c-.5-.2-1-.5-1.5-.9l-2.1.6-1.6-2.8 1.5-1.6a7.5 7.5 0 0 1 0-1.8L4.6 8l1.6-2.8 2.1.6c.5-.4 1-.7 1.5-.9z"/><circle cx="12" cy="10.5" r="2.4"/></svg></button>
        <button type="submit" id="sendBtn" class="wd-quick-send" disabled aria-label="发送">发送</button>
    </form></div>
</section>
<section id="wd-chat" class="wd-panel wd-spectrum" hidden role="region" aria-label="闻道智能回复">
    <span class="wd-morph-label" aria-hidden="true">闻道智能</span>
    <div class="wd-panel-content">
        <div id="chatContainer" class="wd-messages" role="log" aria-label="对话记录"></div>
        <p id="wendao-status" role="status"></p>
        <div class="wd-reply-actions"><button type="button" id="wd-continue" class="btn wd-continue">继续提问</button><a id="wd-full-workspace" class="wd-expand" href="{% url 'ai_workspace' classroom.pk %}" aria-label="展开全屏工作区" title="展开全屏工作区"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></a></div>
    </div>
</section>
<section id="wd-model-panel" class="wd-panel wd-spectrum wd-model-panel" hidden role="region" aria-label="选择闻道模型">
    <span class="wd-morph-label" aria-hidden="true"></span>
    <div class="wd-panel-content"><div class="wd-model-title">选择模型</div><select id="wendao-model" size="6" aria-label="可用模型" disabled></select><p id="wd-model-status" role="status"></p><a href="{% url 'settings' %}?classroom={{ classroom.pk }}#wendao">连接设置</a></div>
</section>
<section id="wd-suggestions" class="wd-panel wd-suggestion-stack" hidden role="region" aria-label="排座建议">
    <div class="wd-panel-content">
        <p id="wd-suggestion-status" role="status"></p>
        <div id="wd-suggestion-list" class="wd-messages"></div>
    </div>
</section>
