<div id="future-mode-root" hidden data-inline-dock="1" data-chat-url="{% url 'wendao_chat' classroom.pk %}" data-chat-stream-url="{% url 'wendao_chat_stream' classroom.pk %}" data-classroom-id="{{ classroom.pk }}" data-classroom-name="{{ classroom.name }}" data-csrf="{{ csrf_token }}"></div>
{# 闻道智能左侧栏：标题 → 模型选择 → 排座建议 → 对话 → 底部输入框（澄光 AIComposer） #}
<aside id="wd-side" class="wd-side" aria-label="闻道智能" aria-hidden="true" inert>
    <header class="wd-side-head">
        <span class="lc-ai-orb lc-ai-orb--sm wd-side-orb" id="wd-side-orb" aria-hidden="true"></span>
        <div class="wd-side-title">
            <strong>闻道智能</strong>
            <button type="button" id="wd-model-trigger" class="wd-model-chip" aria-expanded="false" aria-controls="wd-model-panel">
                <span id="wd-model-name">选择模型</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
            </button>
        </div>
        <a id="wd-full-workspace" class="wd-side-icon" href="{% url 'ai_workspace' classroom.pk %}" aria-label="展开全屏工作区" title="展开全屏工作区">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
        </a>
        <button type="button" class="wd-side-icon" data-wd-close aria-label="收起闻道智能" title="收起">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15M16 10l-2 2 2 2"/></svg>
        </button>
    </header>
    <section id="wd-model-panel" class="wd-model-panel" hidden aria-label="选择闻道模型">
        <select id="wendao-model" size="5" aria-label="可用模型" disabled></select>
        <div class="wd-model-foot">
            <p id="wd-model-status" role="status"></p>
            <a href="{% url 'settings' %}?classroom={{ classroom.pk }}#wendao">连接设置</a>
        </div>
    </section>
    <div class="wd-side-scroll" id="wd-side-scroll">
        <section id="wd-suggestions" class="wd-suggest-block" hidden aria-label="排座建议">
            <div class="wd-side-label">排座建议</div>
            <p id="wd-suggestion-status" role="status"></p>
            <div id="wd-suggestion-list" class="wd-suggestion-list"></div>
        </section>
        <div id="chatContainer" class="wd-messages" role="log" aria-live="polite" aria-label="对话记录"></div>
        <p id="wendao-status" role="status"></p>
    </div>
    <form id="future-chat-form" class="lc-ai-glow lc-ai-composer wd-composer" data-state="idle" aria-label="向闻道智能提问">
        <textarea id="userInput" rows="1" placeholder="问问闻道，或输入 / 调用班级命令" aria-label="向闻道智能提问" autocomplete="off" maxlength="16000"></textarea>
        <button type="submit" id="sendBtn" class="lc-ai-send" disabled aria-label="发送">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
    </form>
</aside>
