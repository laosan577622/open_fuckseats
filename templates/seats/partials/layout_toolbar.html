<div class="context-toolbar-row">
    <div class="toolbar-group">
        <a href="{% url 'classroom_detail' classroom.pk %}?cloud_sync=return" class="btn btn-secondary">返回班级</a>
        <span class="toolbar-group-label">导航</span>
    </div>
    <div class="toolbar-group">
        <button type="button" class="btn btn-secondary" id="togglePreviewBtn" data-layout-preview-toggle="1" aria-pressed="false">打开预览</button>
        <span class="toolbar-group-label">预览</span>
    </div>
    <div class="toolbar-group">
        <button type="button" class="btn btn-secondary" id="layoutUndoBtn" title="撤销 (Ctrl+Z)">撤销</button>
        <button type="button" class="btn btn-secondary" id="layoutRedoBtn" title="重做 (Ctrl+Y)">重做</button>
        <span class="toolbar-group-label">历史</span>
    </div>
</div>
