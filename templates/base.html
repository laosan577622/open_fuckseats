<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}不想排座位{% endblock %}</title>
    {% load static %}
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=3.3">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.css" />
    {% block extra_head %}{% endblock %}
    <script src="{% static 'js/theme.js' %}?v=1.0"></script>
    <script src="{% url 'frontend_store_js' %}?v=1.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.js.iife.js"></script>
</head>

<body data-app-shell="{{ app_runtime.shell }}">
    <header class="app-header">
        <div class="header-content" data-ribbon-host>
            <div class="header-titlebar">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <a href="{% url 'index' %}" class="logo">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="logo-svg">
                            <rect x="3" y="3" width="7" height="7" rx="2" fill="currentColor" />
                            <rect x="14" y="3" width="7" height="7" rx="2" fill="currentColor" fill-opacity="0.7" />
                            <rect x="3" y="14" width="7" height="7" rx="2" fill="currentColor" fill-opacity="0.7" />
                            <rect x="14" y="14" width="7" height="7" rx="2" fill="currentColor" />
                        </svg>
                        <div class="logo-meta">
                            <span>不想排座位</span>
                            <small>教室排座工作区</small>
                        </div>
                    </a>
                    <div class="ribbon-tab-strip">
                        {% block ribbon_tabs %}
                        <button type="button" class="ribbon-tab active" data-ribbon-tab="home">开始</button>
                        {% endblock %}
                    </div>
                </div>
                <div class="cloud-header-area" id="cloud-header-area"></div>
                <div class="titlebar-badge">开始</div>
            </div>
            <div class="header-ribbon">
                <div class="header-actions">
                    {% block actions %}{% endblock %}
                </div>
            </div>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <div id="toast-container"></div>

    <!-- 更新通知弹窗 -->
    <div id="update-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content update-modal">
            <div class="modal-header">
                <div>
                    <h3>发现新版本</h3>
                    <p class="version-info">
                        <span id="current-version"></span> → <span id="latest-version"></span>
                    </p>
                    <div class="update-details-block" aria-live="polite">
                        <div class="update-details-label">更新详情</div>
                        <div id="update-details-content" class="update-details-content" data-state="loading">正在加载更新详情...</div>
                    </div>
                </div>
                <button id="close-update-modal" class="modal-close-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6.7 6.7a1 1 0 0 1 1.4 0L12 10.6l3.9-3.9a1 1 0 1 1 1.4 1.4L13.4 12l3.9 3.9a1 1 0 0 1-1.4 1.4L12 13.4l-3.9 3.9a1 1 0 0 1-1.4-1.4L10.6 12 6.7 8.1a1 1 0 0 1 0-1.4z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div id="update-prompt">
                    <p>检测到新版本可用，是否立即更新？</p>
                    <div class="modal-actions">
                        <button id="later-btn" class="btn btn-secondary">稍后提醒</button>
                        <button id="update-btn" class="btn btn-primary">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2a1 1 0 0 1 1 1v10.6l3.3-3.3a1 1 0 1 1 1.4 1.4l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.4L11 13.6V3a1 1 0 0 1 1-1z" fill="currentColor"/>
                                <path d="M4 17a1 1 0 0 1 1 1v1a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a1 1 0 1 1 2 0v1a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-1a1 1 0 0 1 1-1z" fill="currentColor"/>
                            </svg>
                            立即更新
                        </button>
                    </div>
                </div>
                <div id="update-progress" style="display: none;">
                    <p id="update-status">正在准备更新...</p>
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                    <p id="progress-text" class="progress-text"></p>
                    <div id="update-install-actions" class="modal-actions" style="display: none;">
                        <button id="install-and-exit-btn" class="btn btn-primary">开始安装并退出程序</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'js/cloud.js' %}?v=1.4"></script>
    <script src="{% static 'js/toast.js' %}?v=2.0"></script>
    <script src="{% static 'js/update.js' %}?v=2.0"></script>
    <script src="{% static 'js/effects.js' %}?v=2.0"></script>
    <script src="{% static 'js/desktop_bridge.js' %}?v=20260430"></script>
    <script src="{% static 'js/main.js' %}"></script>
    <script>
    (function() {
        function initCloudHeader() {
            var container = document.getElementById('cloud-header-area');
            if (!container || !window.CloudManager) return;
            if (container.dataset.cloudHeaderManaged === 'classroom') return;
            CloudManager.getUserInfo().then(function(data) {
                if (data.logged_in) {
                    var avatar = data.avatar_url
                        ? '<img src="' + data.avatar_url + '" class="cloud-header-avatar" alt="" />'
                        : '<div class="cloud-header-avatar cloud-header-avatar-placeholder"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z" fill="currentColor"/></svg></div>';
                    container.innerHTML = '<a href="{% url "settings" %}" class="cloud-header-user" title="' + data.nickname + ' (' + data.tier_display + ')">' + avatar + '</a>';
                } else {
                    container.innerHTML = '<a href="javascript:void(0)" class="cloud-header-login-btn" onclick="CloudManager.openLogin()">登录</a>';
                }
            });
        }
        function countSyncedRows(result) {
            var rows = result && Array.isArray(result.results) ? result.results : [];
            return rows.filter(function(row) {
                return row && (row.status === 'ok' || row.status === 'up_to_date' || row.status === 'pulled');
            }).length;
        }
        function shouldRefreshHomeAfterCloudSync(result) {
            if (window.FuckSeatsCloudSync) return false;
            if (window.location.pathname !== '/') return false;
            if (!document.querySelector('.classrooms-grid')) return false;
            var rows = result && Array.isArray(result.results) ? result.results : [];
            return rows.some(function(row) {
                return row && (
                    row.remote_only ||
                    row.status === 'pulled' ||
                    row.status === 'ok'
                );
            });
        }
        function refreshHomeAfterCloudSync(result) {
            if (!shouldRefreshHomeAfterCloudSync(result)) return;
            setTimeout(function() {
                window.location.reload();
            }, 650);
        }
        function notifyOpenerCloudLogin(result) {
            if (!window.opener || window.opener.closed) return;
            try {
                window.opener.postMessage({
                    type: 'fuckseats-cloud-login-sync-complete',
                    result: result || null
                }, window.location.origin);
            } catch (error) {}
        }
        function autoSyncAfterCloudLogin(options) {
            options = options || {};
            if (!window.CloudManager) return;
            CloudManager.getUserInfo(true).then(function(data) {
                if (!data || !data.logged_in) return null;
                if (typeof showToast === 'function') showToast('云服务登录成功，正在自动同步');
                return CloudManager.sync(null, { auto: true });
            }).then(function(result) {
                if (!result) return;
                var syncedCount = countSyncedRows(result);
                if (typeof showToast === 'function') {
                    showToast(syncedCount ? '自动同步完成' : '自动同步完成，没有需要更新的班级');
                }
                initCloudHeader();
                refreshHomeAfterCloudSync(result);
                if (options.notifyOpener !== false) notifyOpenerCloudLogin(result);
            }).catch(function(error) {
                if (typeof showToast === 'function') {
                    showToast((error && error.message) || '自动同步失败');
                }
                if (options.notifyOpener !== false) notifyOpenerCloudLogin(null);
            });
        }
        function handleCloudLoginSyncComplete(result) {
            CloudManager.getUserInfo(true).then(function() {
                initCloudHeader();
                if (window.FuckSeatsCloudSync && typeof window.FuckSeatsCloudSync.syncAfterLogin === 'function') {
                    return window.FuckSeatsCloudSync.syncAfterLogin(result);
                }
                refreshHomeAfterCloudSync(result);
                return null;
            }).catch(function(error) {
                if (typeof showToast === 'function') {
                    showToast((error && error.message) || '云同步状态刷新失败');
                }
            });
        }
        window.addEventListener('message', function(event) {
            if (event.origin !== window.location.origin) return;
            var data = event.data || {};
            if (!data || data.type !== 'fuckseats-cloud-login-sync-complete') return;
            handleCloudLoginSyncComplete(data.result || null);
        });
        window.addEventListener('cloud-login-sync-complete', function(event) {
            var detail = event.detail || {};
            handleCloudLoginSyncComplete(detail.result || null);
        });
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initCloudHeader);
        } else {
            initCloudHeader();
        }
        var params = new URLSearchParams(window.location.search);
        if (params.get('cloud_login') === 'success') {
            window.history.replaceState({}, '', window.location.pathname);
            setTimeout(function() {
                initCloudHeader();
                autoSyncAfterCloudLogin();
            }, 300);
        } else if (params.get('cloud_login') === 'failed') {
            window.history.replaceState({}, '', window.location.pathname);
            setTimeout(function() {
                if (typeof showToast === 'function') showToast('云服务登录失败，请重试');
            }, 300);
        }
    })();
    </script>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
