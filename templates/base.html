<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}不想排座位{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=1.9">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.css" />
    {% block extra_head %}{% endblock %}
    <script src="{% url 'frontend_store_js' %}?v=1.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.js.iife.js"></script>
</head>

<body data-app-shell="{{ app_runtime.shell }}">
    <header class="app-header">
        <div class="header-content" data-ribbon-host>
            <div class="header-titlebar">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <a href="{% url 'index' %}" class="logo">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="3" width="7" height="7" rx="2" fill="#0a59f7" />
                            <rect x="14" y="3" width="7" height="7" rx="2" fill="#0a59f7" fill-opacity="0.7" />
                            <rect x="3" y="14" width="7" height="7" rx="2" fill="#0a59f7" fill-opacity="0.7" />
                            <rect x="14" y="14" width="7" height="7" rx="2" fill="#0a59f7" />
                        </svg>
                        <div class="logo-meta">
                            <span>不想排座位</span>
                            <small>教室排座工作区</small>
                        </div>
                    </a>
                    <div class="ribbon-tab-strip">
                        {% block ribbon_tabs %}
                        <button type="button" class="ribbon-tab active" data-ribbon-tab="home">开始</button>
                        {% endblock %}
                    </div>
                </div>
                <div class="titlebar-badge">开始</div>
            </div>
            <div class="header-ribbon">
                <div class="header-actions">
                    {% block actions %}{% endblock %}
                </div>
            </div>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <div id="toast-container"></div>

    <!-- 更新通知弹窗 -->
    <div id="update-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content update-modal">
            <div class="modal-header">
                <div>
                    <h3>发现新版本</h3>
                    <p class="version-info">
                        <span id="current-version"></span> → <span id="latest-version"></span>
                    </p>
                    <div class="update-details-block" aria-live="polite">
                        <div class="update-details-label">更新详情</div>
                        <div id="update-details-content" class="update-details-content" data-state="loading">正在加载更新详情...</div>
                    </div>
                </div>
                <button id="close-update-modal" class="modal-close-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6.7 6.7a1 1 0 0 1 1.4 0L12 10.6l3.9-3.9a1 1 0 1 1 1.4 1.4L13.4 12l3.9 3.9a1 1 0 0 1-1.4 1.4L12 13.4l-3.9 3.9a1 1 0 0 1-1.4-1.4L10.6 12 6.7 8.1a1 1 0 0 1 0-1.4z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div id="update-prompt">
                    <p>检测到新版本可用，是否立即更新？</p>
                    <div class="modal-actions">
                        <button id="later-btn" class="btn btn-secondary">稍后提醒</button>
                        <button id="update-btn" class="btn btn-primary">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2a1 1 0 0 1 1 1v10.6l3.3-3.3a1 1 0 1 1 1.4 1.4l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.4L11 13.6V3a1 1 0 0 1 1-1z" fill="currentColor"/>
                                <path d="M4 17a1 1 0 0 1 1 1v1a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a1 1 0 1 1 2 0v1a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-1a1 1 0 0 1 1-1z" fill="currentColor"/>
                            </svg>
                            立即更新
                        </button>
                    </div>
                </div>
                <div id="update-progress" style="display: none;">
                    <p id="update-status">正在准备更新...</p>
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                    <p id="progress-text" class="progress-text"></p>
                    <div id="update-install-actions" class="modal-actions" style="display: none;">
                        <button id="install-and-exit-btn" class="btn btn-primary">开始安装并退出程序</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 480px;
            width: 90%;
            padding: 32px;
            animation: modalSlideIn 0.3s ease-out;
        }

        /* 强制全屏的更新弹窗 */
        #update-modal .modal-content.update-modal {
            max-width: 100vw;
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        #update-modal .modal-header {
            justify-content: center;
            width: 100%;
            position: relative;
            margin-bottom: 40px;
        }

        #update-modal .modal-header > div {
            width: min(100%, 720px);
        }

        .modal-header h3 {
            font-size: 24px;
            font-weight: 700;
            color: #0a59f7;
            margin: 0 0 8px 0;
        }

        #update-modal .modal-header h3 {
            font-size: 36px;
            margin-bottom: 16px;
        }

        .version-info {
            font-size: 14px;
            color: #666;
            margin: 0;
        }

        #update-modal .version-info {
            font-size: 18px;
        }

        .update-details-block {
            margin-top: 16px;
            padding: 16px 18px;
            border-radius: 20px;
            border: 1px solid rgba(10, 89, 247, 0.12);
            background: rgba(10, 89, 247, 0.06);
            text-align: left;
        }

        #update-modal .update-details-block {
            margin-top: 20px;
            padding: 20px 22px;
            border-radius: 24px;
        }

        .update-details-label {
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #0a59f7;
        }

        .update-details-content {
            margin: 0;
            font-size: 14px;
            line-height: 1.7;
            color: #334155;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 220px;
            overflow: auto;
        }

        #update-modal .update-details-content {
            font-size: 15px;
            max-height: 260px;
        }

        .update-details-content[data-state="loading"],
        .update-details-content[data-state="empty"],
        .update-details-content[data-state="error"] {
            color: #64748b;
        }

        .modal-close-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            padding: 4px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        #update-modal .modal-close-btn {
            position: absolute;
            top: 0;
            right: 0;
            padding: 12px;
        }

        .modal-close-btn:hover {
            background: #f0f0f0;
            color: #333;
        }

        .modal-body p {
            color: #666;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        #update-modal .modal-body {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-actions .btn {
            flex: 1;
            padding: 12px 24px;
            border-radius: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #666;
            border: none;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            margin: 16px 0;
        }

        .progress-fill {
            height: 100%;
            background: #0a59f7;
            transition: width 0.3s ease;
            width: 0%;
        }

        .progress-text {
            font-size: 13px;
            color: #666;
            text-align: right;
            margin: 0;
        }

        #update-install-actions {
            margin-top: 18px;
        }

        #update-status {
            font-weight: 600;
            color: #333;
        }
    </style>

    <script>
        // 更新检查和管理
        (function() {
            let pollingInterval = null;
            const INSTALL_LAUNCH_DELAY_MS = 2000;
            const INSTALL_LAUNCH_DELAY_TEXT = '2 秒';
            const UPDATE_DETAILS_URL = 'https://fuckseats.577622.xyz/update.txt';
            let updateDetailsRequestId = 0;

            // 全局更新信息，统一通过 window.updateInfo 读写
            window.updateInfo = null;

            // 启动时检查更新
            async function checkUpdate() {
                try {
                    const response = await fetch('/api/update/check/');
                    const data = await response.json();

                    if (data.status === 'success' && data.update_available) {
                        window.updateInfo = data;
                        showUpdateModal();
                    }
                } catch (error) {
                    console.error('Update check error:', error);
                }
            }

            function setInstallActionVisible(visible, pending = false) {
                const installActions = document.getElementById('update-install-actions');
                const installBtn = document.getElementById('install-and-exit-btn');
                installActions.style.display = visible ? 'flex' : 'none';
                installBtn.disabled = pending;
                installBtn.textContent = pending ? '正在启动安装程序...' : '开始安装并退出程序';
            }

            function resetUpdateProgressView() {
                const statusEl = document.getElementById('update-status');
                const progressFill = document.getElementById('progress-fill');
                const progressText = document.getElementById('progress-text');
                statusEl.textContent = '正在准备更新...';
                progressFill.style.width = '0%';
                progressText.textContent = '';
                setInstallActionVisible(false);
            }

            function renderUpdateDetails(text, state = 'loaded') {
                const detailsEl = document.getElementById('update-details-content');
                if (!detailsEl) return;
                detailsEl.dataset.state = state;
                detailsEl.textContent = text;
            }

            async function loadUpdateDetails() {
                const requestId = ++updateDetailsRequestId;
                const fallbackText = String((window.updateInfo && window.updateInfo.notes) || '').trim();

                renderUpdateDetails('正在加载更新详情...', 'loading');

                try {
                    const detailUrl = `${UPDATE_DETAILS_URL}?t=${Date.now()}`;
                    const response = await fetch(detailUrl, { cache: 'no-store' });
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const remoteText = (await response.text()).trim();
                    if (requestId !== updateDetailsRequestId) return;

                    if (remoteText) {
                        renderUpdateDetails(remoteText, 'loaded');
                        return;
                    }

                    if (fallbackText) {
                        renderUpdateDetails(fallbackText, 'loaded');
                        return;
                    }

                    renderUpdateDetails('暂无更新详情。', 'empty');
                } catch (error) {
                    console.error('Update details fetch error:', error);
                    if (requestId !== updateDetailsRequestId) return;

                    if (fallbackText) {
                        renderUpdateDetails(fallbackText, 'loaded');
                        return;
                    }

                    renderUpdateDetails('暂时无法加载更新详情，请稍后重试。', 'error');
                }
            }

            function showUpdateModal() {
                if (!window.updateInfo) return;
                const modal = document.getElementById('update-modal');
                const currentVersion = document.getElementById('current-version');
                const latestVersion = document.getElementById('latest-version');
                const promptDiv = document.getElementById('update-prompt');
                const progressDiv = document.getElementById('update-progress');
                const closeBtn = document.getElementById('close-update-modal');

                currentVersion.textContent = window.updateInfo.current_version;
                latestVersion.textContent = window.updateInfo.latest_version;

                // 重置弹窗到初始状态
                promptDiv.style.display = 'block';
                progressDiv.style.display = 'none';
                closeBtn.style.display = '';
                resetUpdateProgressView();

                modal.style.display = 'flex';
                loadUpdateDetails();
            }

            function hideUpdateModal() {
                const modal = document.getElementById('update-modal');
                modal.style.display = 'none';
                if (pollingInterval) {
                    clearInterval(pollingInterval);
                    pollingInterval = null;
                }
            }

            async function startUpdate() {
                const promptDiv = document.getElementById('update-prompt');
                const progressDiv = document.getElementById('update-progress');
                const closeBtn = document.getElementById('close-update-modal');

                promptDiv.style.display = 'none';
                progressDiv.style.display = 'block';
                closeBtn.style.display = 'none';
                resetUpdateProgressView();

                try {
                    const response = await fetch('/api/update/start/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ target_version: window.updateInfo.latest_version })
                    });
                    const data = await response.json();

                    if (data.status === 'success') {
                        updateProgress(data);
                        startPolling();
                    } else {
                        showUpdateError(data.message || '更新失败');
                    }
                } catch (error) {
                    showUpdateError('更新请求失败');
                    console.error('Update start error:', error);
                }
            }

            function showUpdateError(message) {
                const closeBtn = document.getElementById('close-update-modal');
                const statusEl = document.getElementById('update-status');
                setInstallActionVisible(false);
                statusEl.textContent = message;
                closeBtn.style.display = '';
            }

            function startPolling() {
                if (pollingInterval) {
                    clearInterval(pollingInterval);
                }
                pollingInterval = setInterval(async () => {
                    try {
                        const response = await fetch('/api/update/status/');
                        const data = await response.json();

                        if (data.status === 'success') {
                            updateProgress(data);
                        }
                    } catch (error) {
                        console.error('Status polling error:', error);
                    }
                }, 1000);
            }

            async function requestDesktopExitForInstall() {
                const api = window.pywebview && window.pywebview.api;
                if (!api || typeof api.close_app_for_update !== 'function') {
                    throw new Error('当前桌面程序不支持自动退出');
                }
                return api.close_app_for_update();
            }

            async function startInstallAndExit() {
                const statusEl = document.getElementById('update-status');
                const progressText = document.getElementById('progress-text');
                const closeBtn = document.getElementById('close-update-modal');

                statusEl.textContent = `将在 ${INSTALL_LAUNCH_DELAY_TEXT} 后打开安装程序...`;
                progressText.textContent = '请稍候，安装程序启动后将自动退出当前程序';
                closeBtn.style.display = 'none';
                setInstallActionVisible(true, true);

                try {
                    await new Promise((resolve) => window.setTimeout(resolve, INSTALL_LAUNCH_DELAY_MS));

                    const response = await fetch('/api/update/install/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: '{}'
                    });
                    const data = await response.json();

                    if (data.status !== 'success') {
                        showUpdateError(data.message || '启动安装程序失败');
                        setInstallActionVisible(true, false);
                        return;
                    }

                    updateProgress(data);
                    progressText.textContent = '安装程序已启动，正在退出当前程序...';
                    window.setTimeout(async () => {
                        try {
                            await requestDesktopExitForInstall();
                        } catch (error) {
                            console.error('Desktop exit error:', error);
                            showUpdateError('安装程序已启动，请手动关闭当前程序后继续安装');
                        }
                    }, 80);
                } catch (error) {
                    showUpdateError('启动安装程序失败');
                    setInstallActionVisible(true, false);
                    console.error('Update install error:', error);
                }
            }

            function updateProgress(data) {
                const statusEl = document.getElementById('update-status');
                const progressFill = document.getElementById('progress-fill');
                const progressText = document.getElementById('progress-text');
                const closeBtn = document.getElementById('close-update-modal');

                if (data.state === 'downloading') {
                    setInstallActionVisible(false);
                    statusEl.textContent = '正在下载更新安装包...';
                    closeBtn.style.display = 'none';
                    if (data.progress && data.progress.percent !== null) {
                        progressFill.style.width = data.progress.percent + '%';
                        const receivedMB = (data.progress.received_bytes / 1024 / 1024).toFixed(1);
                        const totalMB = (data.progress.total_bytes / 1024 / 1024).toFixed(1);
                        progressText.textContent = `${data.progress.percent}% (${receivedMB} MB / ${totalMB} MB)`;
                    }
                } else if (data.state === 'ready_to_install') {
                    statusEl.textContent = '更新准备完成';
                    progressFill.style.width = '100%';
                    progressText.textContent = `点击下方按钮后，将在 ${INSTALL_LAUNCH_DELAY_TEXT} 后打开安装程序，然后自动退出当前程序`;
                    closeBtn.style.display = '';
                    setInstallActionVisible(true, false);
                    clearInterval(pollingInterval);
                    pollingInterval = null;
                } else if (data.state === 'installer_started') {
                    setInstallActionVisible(false);
                    statusEl.textContent = '安装程序已启动';
                    progressFill.style.width = '100%';
                    progressText.textContent = '桌面程序正在退出，请在安装界面中继续完成更新';
                    closeBtn.style.display = 'none';
                    clearInterval(pollingInterval);
                    pollingInterval = null;
                } else if (data.state === 'error') {
                    showUpdateError(data.last_error || '更新出错');
                }
            }

            // 暴露给全局使用
            window.showUpdateModal = showUpdateModal;
            window.hideUpdateModal = hideUpdateModal;

            // 事件监听
            document.addEventListener('DOMContentLoaded', () => {
                // 启动时检查更新
                checkUpdate();

                // 关闭按钮
                document.getElementById('close-update-modal').addEventListener('click', hideUpdateModal);
                document.getElementById('later-btn').addEventListener('click', hideUpdateModal);

                // 立即更新按钮
                document.getElementById('update-btn').addEventListener('click', startUpdate);
                document.getElementById('install-and-exit-btn').addEventListener('click', startInstallAndExit);
            });

            // Toast 提示函数
            window.showToast = function(message) {
                const toastContainer = document.getElementById('toast-container');
                if (!toastContainer) return;

                const toast = document.createElement('div');
                toast.className = 'toast-notification';
                toast.innerHTML = `
                    <div class="toast-header">
                        <span>提示</span>
                        <span style="color:var(--text-secondary, #999); font-weight:400; font-size:11px;">刚刚</span>
                    </div>
                    <div class="toast-body">${message}</div>
                `;

                toastContainer.appendChild(toast);

                setTimeout(() => {
                    toast.classList.add('toast-exit');
                    toast.addEventListener('animationend', () => {
                        if (toast.parentNode) toast.parentNode.removeChild(toast);
                    });
                }, 3000);
            };
        })();
    </script>

    <style>
        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .toast-notification {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            border-radius: 14px;
            width: 320px;
            padding: 16px;
            pointer-events: auto;
            animation: slideInRight 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .toast-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary, #333);
        }

        .toast-body {
            font-size: 13px;
            color: var(--text-secondary, #666);
            line-height: 1.5;
        }

        .toast-notification.toast-exit {
            animation: slideOutRight 0.3s cubic-bezier(0.4, 0, 1, 1) forwards;
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(40px); filter: blur(4px); }
            to { opacity: 1; transform: translateX(0); filter: blur(0px); }
        }

        @keyframes slideOutRight {
            from { opacity: 1; transform: translateX(0); filter: blur(0px); }
            to { opacity: 0; transform: translateX(40px); filter: blur(4px); }
        }
    </style>

    <script src="{% static 'js/desktop_bridge.js' %}?v=20260327"></script>
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
